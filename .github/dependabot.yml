# Dependabot 設定
#
# 注: root cargo entry は置かない
#       alice-ml は git の main を引き、更新は `cargo update -p alice-ml` で対応
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

